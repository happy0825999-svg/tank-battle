<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="纯 HTML5 Canvas 实现的经典坦克大战 (Battle City),零依赖,支持键盘与触屏操作。">
<title>坦克大战 · Battle City</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#111;
    background-image: radial-gradient(circle at 50% 0%, #1c1c1c 0%, #111 60%);
    color:#ccc;
    font-family:"Courier New","Microsoft YaHei",monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:14px; gap:14px;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap { display:flex; gap:16px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
  #field { position:relative; line-height:0; }
  canvas#game {
    width:min(74vw, 64vh, 624px);
    image-rendering:pixelated;
    background:#000;
    border:3px solid #4a4a4a;
    box-shadow:0 0 24px rgba(255,210,63,.12), 0 6px 30px rgba(0,0,0,.7);
  }
  /* ---------- overlay ---------- */
  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:12px;
    background:rgba(0,0,0,.8);
    z-index:5;
  }
  #overlay h1 {
    color:#ffd23f; font-size:clamp(28px,7vw,44px); letter-spacing:8px;
    text-shadow:0 0 16px rgba(255,210,63,.55);
  }
  #overlay h1.red { color:#ff5a4a; text-shadow:0 0 16px rgba(255,90,74,.55); }
  #overlay .sub { color:#9a9a9a; letter-spacing:6px; font-size:13px; }
  #overlay .rules { font-size:13px; line-height:1.9; color:#bbb; }
  #overlay p b { color:#ffd23f; }
  #overlay .new { color:#ffd23f; animation:blink 1s step-end infinite; }
  .btn {
    background:#2a2a2a; color:#ffd23f; border:2px solid #ffd23f;
    font-family:inherit; font-size:16px; letter-spacing:4px;
    padding:10px 28px; cursor:pointer;
  }
  .btn:hover { background:#ffd23f; color:#111; }
  .blink { animation:blink 1.2s step-end infinite; color:#888; font-size:12px; }
  @keyframes blink { 50% { opacity:.15; } }
  /* ---------- HUD ---------- */
  #hud {
    width:190px; background:#181818; border:3px solid #3a3a3a;
    padding:14px 16px; font-size:14px; line-height:1;
  }
  #hud h1 { color:#ffd23f; font-size:20px; letter-spacing:4px; text-align:center; }
  #hud .sub { text-align:center; color:#777; font-size:10px; letter-spacing:3px; margin:6px 0 14px; }
  #hud .stat {
    display:flex; justify-content:space-between; align-items:baseline;
    padding:9px 0; border-top:1px dashed #333;
  }
  #hud .stat label { color:#9a9a9a; font-size:12px; }
  #hud .stat span { color:#ffd23f; font-size:16px; font-weight:bold; }
  #hud .stat.buffs span { font-size:12px; color:#7fd0e0; }
  #muteBtn {
    width:100%; margin-top:14px; padding:8px; cursor:pointer;
    background:#222; color:#bbb; border:2px solid #3a3a3a; font-family:inherit; font-size:13px;
  }
  #muteBtn:hover { border-color:#ffd23f; color:#ffd23f; }
  #hud .hint { margin-top:12px; font-size:11px; color:#666; line-height:1.8; text-align:center; }
  /* ---------- touch controls ---------- */
  #touch { display:none; width:min(92vw, 500px); justify-content:space-between; align-items:center; gap:20px; }
  body.touch #touch { display:flex; }
  #dpad { display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,58px); gap:4px; }
  #dpad button {
    font-size:22px; color:#ddd; background:#242424; border:2px solid #555; border-radius:8px;
    touch-action:none; cursor:pointer;
  }
  #dpad button:active, #fireBtn:active { background:#ffd23f; color:#111; border-color:#ffd23f; }
  #dpad .up { grid-area:1/2; } #dpad .left { grid-area:2/1; }
  #dpad .down { grid-area:3/2; } #dpad .right { grid-area:2/3; }
  #fireBtn {
    width:96px; height:96px; border-radius:50%;
    background:#8a2424; border:3px solid #e06060; color:#fff;
    font-family:inherit; font-size:15px; font-weight:bold; letter-spacing:2px;
    touch-action:none; cursor:pointer;
  }
  @media (max-width:520px){
    #hud { width:100%; display:grid; grid-template-columns:1fr 1fr 1fr; column-gap:10px; padding:10px 12px; }
    #hud h1,#hud .sub,#hud .hint { display:none; }
    #hud .stat { border:none; flex-direction:column; gap:4px; padding:6px 0; }
    #muteBtn { grid-column:2/4; margin:6px 0 0; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="field">
    <canvas id="game" width="208" height="208"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="hud">
    <h1>坦克大战</h1>
    <p class="sub">BATTLE CITY</p>
    <div class="stat"><label>得分</label><span id="score">000000</span></div>
    <div class="stat"><label>关卡</label><span id="stage">01</span></div>
    <div class="stat"><label>敌军</label><span id="enemies">×20</span></div>
    <div class="stat"><label>生命</label><span id="lives">×3</span></div>
    <div class="stat buffs"><label>状态</label><span id="buffs">—</span></div>
    <button id="muteBtn">🔊 音效开</button>
    <p class="hint">↑↓←→ / WASD 移动<br>空格 射击 · P 暂停<br>Enter 开始</p>
  </div>
</div>
<div id="touch">
  <div id="dpad">
    <button class="up" data-k="up">▲</button>
    <button class="left" data-k="left">◀</button>
    <button class="down" data-k="down">▼</button>
    <button class="right" data-k="right">▶</button>
  </div>
  <button id="fireBtn">开火</button>
</div>
<script>
(() => {
'use strict';

// ---------- 常量 ----------
const TILE = 16, COLS = 13, ROWS = 13, W = COLS * TILE, H = ROWS * TILE; // 208
const T = { EMPTY:0, BRICK:1, STEEL:2, WATER:3, TREE:4, BASE:5 };
const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

// 地图: . 空地  B 砖墙  S 钢墙  W 水  T 树林  E 基地
const LEVEL = [
  ".............",
  "BB.BB..BB.BB.",
  "B...B.B.B...B",
  ".............",
  "S.BB.TT.BB.S.",
  "S.B.BTTB.B.S.",
  "..B.......B..",
  "..B.WW.WW.B..",
  "B..B.....B..B",
  "B..BB...BB..B",
  "....B...B....",
  ".BB.BBBBB.BB.",
  "....BBEBB....",
];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---------- 音效 (Web Audio) ----------
let actx = null, muted = false;
try { muted = localStorage.getItem('tank-muted') === '1'; } catch (e) {}
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function sfx(kind) {
  if (muted) return;
  try {
    const a = audio(), t = a.currentTime;
    const osc = (freq, type, dur, vol, start = 0, slide) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t + start);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + start + dur);
      g.gain.setValueAtTime(vol, t + start);
      g.gain.exponentialRampToValueAtTime(0.001, t + start + dur);
      o.connect(g).connect(a.destination);
      o.start(t + start); o.stop(t + start + dur);
    };
    const noise = (dur, vol) => {
      const n = (a.sampleRate * dur) | 0, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = a.createBufferSource(); s.buffer = buf;
      const g = a.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      s.connect(g).connect(a.destination); s.start(t);
    };
    switch (kind) {
      case 'shoot':  osc(880, 'square', 0.09, 0.12, 0, 110); break;
      case 'boom':   noise(0.28, 0.45); osc(160, 'sawtooth', 0.28, 0.18, 0, 40); break;
      case 'steel':  osc(1200, 'square', 0.05, 0.1); break;
      case 'power':  osc(523, 'square', 0.09, 0.13); osc(784, 'square', 0.12, 0.13, 0.09); break;
      case 'life':   osc(392, 'triangle', 0.1, 0.18); osc(523, 'triangle', 0.1, 0.18, 0.1); osc(659, 'triangle', 0.15, 0.18, 0.2); break;
      case 'over':   osc(440, 'sawtooth', 0.25, 0.18, 0, 220); osc(330, 'sawtooth', 0.3, 0.18, 0.25, 165); osc(220, 'sawtooth', 0.55, 0.18, 0.55, 110); break;
      case 'start':  osc(262, 'square', 0.1, 0.13); osc(330, 'square', 0.1, 0.13, 0.1); osc(392, 'square', 0.15, 0.13, 0.2); break;
    }
  } catch (e) {}
}

// ---------- 游戏状态 ----------
let map, brickHp, player, enemies = [], bullets = [], powerups = [], explosions = [];
let score, lives, stage, bulletLv, shieldT, freezeT;
let spawnQueue = [], spawnTimer, respawnTimer, overTimer, clearTimer;
let baseAlive, paused = false, gameoverReady = false, animTime = 0;
let state = 'title'; // title | play | clear | over
const keys = { up:false, down:false, left:false, right:false, fire:false };

// ---------- 工具 ----------
function overlapBox(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function solidAt(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return true;
  const t = map[ty][tx];
  return t === T.BRICK || t === T.STEEL || t === T.WATER || t === T.BASE;
}
function boxSolid(x, y) {
  const x0 = Math.floor(x / TILE), x1 = Math.floor((x + 15) / TILE);
  const y0 = Math.floor(y / TILE), y1 = Math.floor((y + 15) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (solidAt(tx, ty)) return true;
  return false;
}
function tankOverlap(x, y, self) {
  if (self !== player && player.alive && player.spawnT <= 0 &&
      overlapBox(x, y, 16, 16, player.x, player.y, 16, 16)) return true;
  for (const e of enemies)
    if (e !== self && !e.dead && e.spawnT <= 0 && overlapBox(x, y, 16, 16, e.x, e.y, 16, 16)) return true;
  return false;
}
// 分轴移动: 被挡时尝试只沿一个轴滑动
function moveTank(tank, dx, dy) {
  const nx = tank.x + dx, ny = tank.y + dy;
  if (!boxSolid(nx, ny) && !tankOverlap(nx, ny, tank)) { tank.x = nx; tank.y = ny; return true; }
  if (dx !== 0 && !boxSolid(nx, tank.y) && !tankOverlap(nx, tank.y, tank)) { tank.x = nx; return false; }
  if (dy !== 0 && !boxSolid(tank.x, ny) && !tankOverlap(tank.x, ny, tank)) { tank.y = ny; return false; }
  return false;
}
function countBullets(owner) {
  let n = 0;
  for (const b of bullets) if (!b.dead && b.owner === owner) n++;
  return n;
}
function boom(x, y, big) {
  explosions.push({ x, y, t: big ? 0.5 : 0.22, dur: big ? 0.5 : 0.22, big, seed: Math.random() * 6.28 });
}
function shoot(tank, speed) {
  bullets.push({ x: tank.x + 6, y: tank.y + 6, dir: tank.dir, speed, power: 1, owner: tank, dead: false });
}

// ---------- 敌军 ----------
function buildQueue(stage) {
  const q = [];
  for (let i = 0; i < 20; i++) {
    if (i < 4) { q.push('basic'); continue; }
    const r = Math.random();
    q.push(r < 0.40 ? 'basic' : r < 0.65 ? 'fast' : r < 0.85 ? 'power' : 'heavy');
  }
  return q;
}
function enemyStats(type, stage) {
  const m = Math.min(1 + (stage - 1) * 0.12, 2.0);
  switch (type) {
    case 'basic': return { hp:1, speed:52 * m, pts:100 };
    case 'fast':  return { hp:1, speed:95 * m, pts:200 };
    case 'power': return { hp:1, speed:62 * m, pts:300, fastShot:true };
    case 'heavy': return { hp:3, speed:38 * m, pts:400 };
  }
}
function pickEnemyDir(e) {
  e.dir = Math.random() < 0.35 ? DOWN : Math.floor(Math.random() * 4);
}
function trySpawn() {
  const spots = [{ x:0, y:0 }, { x:96, y:0 }, { x:192, y:0 }];
  for (let i = spots.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [spots[i], spots[j]] = [spots[j], spots[i]];
  }
  for (const s of spots) {
    let blocked = false;
    if (player.alive && player.spawnT <= 0 && overlapBox(player.x, player.y, 16, 16, s.x, s.y, 16, 16)) blocked = true;
    for (const e of enemies)
      if (!e.dead && e.spawnT <= 0 && overlapBox(e.x, e.y, 16, 16, s.x, s.y, 16, 16)) { blocked = true; break; }
    if (!blocked) {
      const type = spawnQueue.shift();
      const st = enemyStats(type, stage);
      enemies.push({
        x: s.x, y: s.y, dir: DOWN, type,
        hp: st.hp, speed: st.speed, pts: st.pts, fastShot: !!st.fastShot,
        shootTimer: 0.8 + Math.random() * 1.2,
        dirTimer: 1 + Math.random() * 1.5,
        spawnT: 0.8, flash: 0, dead: false,
      });
      return true;
    }
  }
  return false;
}
function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.spawnT > 0) { e.spawnT -= dt; continue; }
    if (freezeT > 0) continue; // 冻结中
    e.dirTimer -= dt;
    if (e.dirTimer <= 0) { pickEnemyDir(e); e.dirTimer = 0.8 + Math.random() * 1.8; }
    if (!moveTank(e, DX[e.dir] * e.speed * dt, DY[e.dir] * e.speed * dt)) {
      pickEnemyDir(e);
      e.dirTimer = 0.4 + Math.random() * 1.2;
    }
    e.shootTimer -= dt;
    if (e.shootTimer <= 0) {
      e.shootTimer = 0.9 + Math.random() * 2.0;
      if (countBullets(e) < 1) shoot(e, e.fastShot ? 280 : 210);
    }
  }
  enemies = enemies.filter(e => !e.dead);
}

// ---------- 玩家 ----------
function updatePlayer(dt) {
  if (!player.alive) return;
  if (player.spawnT > 0) { player.spawnT -= dt; return; }
  player.cooldown -= dt;
  const k = keys;
  let dir = -1;
  if (k.up) dir = UP; else if (k.down) dir = DOWN; else if (k.left) dir = LEFT; else if (k.right) dir = RIGHT;
  if (dir >= 0) {
    player.dir = dir;
    moveTank(player, DX[dir] * player.speed * dt, DY[dir] * player.speed * dt);
  }
  const maxB = bulletLv >= 2 ? 2 : 1;
  if (k.fire && player.cooldown <= 0 && countBullets(player) < maxB) {
    shoot(player, 300 + 40 * (bulletLv - 1));
    bullets[bullets.length - 1].power = bulletLv;
    player.cooldown = 0.18;
    sfx('shoot');
  }
}
function killPlayer() {
  if (!player.alive) return;
  player.alive = false;
  lives--;
  bulletLv = 1;
  boom(player.x, player.y, true);
  sfx('boom');
  bullets = bullets.filter(b => b.owner !== player);
  if (lives <= 0) { state = 'over'; overTimer = 2.2; }
  else respawnTimer = 1.2;
}
function respawnPlayer() {
  const sx = 32, sy = 192;
  for (const e of enemies)
    if (!e.dead && e.spawnT <= 0 && overlapBox(e.x, e.y, 16, 16, sx, sy, 16, 16)) { respawnTimer = 0.3; return; }
  player.x = sx; player.y = sy; player.dir = UP;
  player.alive = true; player.spawnT = 0.8; player.shieldT = 2.5;
}

// ---------- 子弹与碰撞 ----------
function updateBullets(dt) {
  for (const b of bullets) {
    b.x += DX[b.dir] * b.speed * dt;
    b.y += DY[b.dir] * b.speed * dt;
    if (b.x < -4 || b.y < -4 || b.x > W || b.y > H) { b.dead = true; continue; }
    const tx = Math.floor((b.x + 2) / TILE), ty = Math.floor((b.y + 2) / TILE);
    if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS) {
      const t = map[ty][tx];
      if (t === T.BRICK) {
        brickHp[ty][tx] -= b.power;
        if (brickHp[ty][tx] <= 0) map[ty][tx] = T.EMPTY;
        boom(tx * TILE, ty * TILE, false);
        b.dead = true; continue;
      } else if (t === T.STEEL) {
        if (b.power >= 3) { map[ty][tx] = T.EMPTY; sfx('boom'); }
        else sfx('steel');
        boom(tx * TILE, ty * TILE, false);
        b.dead = true; continue;
      } else if (t === T.BASE) {
        destroyBase();
        b.dead = true; continue;
      }
    }
    // 打坦克
    if (b.owner === player) {
      for (const e of enemies) {
        if (e.dead || e.spawnT > 0) continue;
        if (overlapBox(b.x, b.y, 4, 4, e.x, e.y, 16, 16)) {
          b.dead = true;
          e.hp--; e.flash = 0.1;
          if (e.hp <= 0) killEnemy(e, true);
          else boom(b.x, b.y, false);
          break;
        }
      }
    } else {
      if (player.alive && player.spawnT <= 0 &&
          overlapBox(b.x, b.y, 4, 4, player.x, player.y, 16, 16)) {
        b.dead = true;
        if (player.shieldT <= 0) killPlayer();
      }
    }
  }
  // 子弹互撞
  for (let i = 0; i < bullets.length; i++) {
    const a = bullets[i];
    if (a.dead) continue;
    for (let j = i + 1; j < bullets.length; j++) {
      const o = bullets[j];
      if (o.dead || o.owner === a.owner) continue;
      if (overlapBox(a.x, a.y, 4, 4, o.x, o.y, 4, 4)) {
        a.dead = o.dead = true;
        boom(a.x, a.y, false);
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
}

// ---------- 击杀 / 基地 / 通关 ----------
function killEnemy(e, fromShot) {
  if (e.dead) return;
  e.dead = true;
  score += e.pts;
  boom(e.x, e.y, true);
  sfx('boom');
  if (fromShot && Math.random() < 0.18) {
    const r = Math.random();
    const type = r < 0.28 ? 'star' : r < 0.48 ? 'grenade' : r < 0.68 ? 'life' : r < 0.84 ? 'shield' : 'freeze';
    powerups.push({ x: e.x, y: e.y, type, t: 8, dead: false });
  }
  if (state === 'play' && spawnQueue.length === 0 && enemies.every(x => x.dead)) stageClear();
}
function destroyBase() {
  if (!baseAlive) return;
  baseAlive = false;
  map[12][6] = T.EMPTY;
  boom(6 * TILE, 12 * TILE, true);
  sfx('boom');
  if (state === 'play') { state = 'over'; overTimer = 2.2; }
}
function stageClear() {
  state = 'clear';
  clearTimer = 2.6;
  sfx('life');
  showOverlay('<h1>关卡 ' + stage + ' 完成!</h1><p>得分 <b>' + score + '</b></p><p class="blink">准备进入第 ' + (stage + 1) + ' 关…</p>');
}

// ---------- 道具 ----------
function updatePowerups(dt) {
  for (const p of powerups) {
    p.t -= dt;
    if (p.t <= 0) { p.dead = true; continue; }
    if (state === 'play' && player.alive && player.spawnT <= 0 &&
        overlapBox(player.x, player.y, 16, 16, p.x, p.y, 16, 16)) {
      applyPower(p.type);
      p.dead = true;
    }
  }
  powerups = powerups.filter(p => !p.dead);
}
function applyPower(type) {
  sfx('power');
  switch (type) {
    case 'star':
      if (bulletLv < 3) bulletLv++;
      else score += 500;
      break;
    case 'grenade':
      for (const e of enemies) if (!e.dead) killEnemy(e, false);
      sfx('boom');
      break;
    case 'life':
      lives = Math.min(lives + 1, 9);
      score += 500;
      sfx('life');
      break;
    case 'shield': shieldT = 8; break;
    case 'freeze': freezeT = 5; break;
  }
}

// ---------- 关卡与流程 ----------
function resetLevel() {
  map = LEVEL.map(r => r.split('').map(ch => ({ '.':0, B:1, S:2, W:3, T:4, E:5 }[ch])));
  brickHp = map.map(row => row.map(t => t === T.BRICK ? 2 : 0));
  enemies = []; bullets = []; powerups = []; explosions = [];
  spawnQueue = buildQueue(stage);
  spawnTimer = 1.0;
  respawnTimer = 0;
  player = { x: 32, y: 192, dir: UP, speed: 95, cooldown: 0, alive: true, spawnT: 0.8, shieldT: 2.5 };
  baseAlive = true;
}
function startGame() {
  audio();
  sfx('start');
  score = 0; lives = 3; stage = 1; bulletLv = 1; shieldT = 0; freezeT = 0;
  paused = false; gameoverReady = false;
  resetLevel();
  state = 'play';
  hideOverlay();
  updateHUD();
}
function showGameOver() {
  gameoverReady = true;
  sfx('over');
  let best = 0;
  try { best = parseInt(localStorage.getItem('tank-best') || '0', 10) || 0; } catch (e) {}
  let isNew = false;
  if (score > best) {
    best = score; isNew = true;
    try { localStorage.setItem('tank-best', String(best)); } catch (e) {}
  }
  showOverlay(
    '<h1 class="red">GAME OVER</h1>' +
    '<p>最终得分 <b>' + score + '</b></p>' +
    '<p>最高纪录 <b>' + best + '</b>' +
    (isNew ? ' <span class="new">新纪录!</span>' : '') + '</p>' +
    '<button id="restartBtn" class="btn">重新开始</button>' +
    '<p class="blink">按 Enter 重新开始</p>'
  );
  const rb = document.getElementById('restartBtn');
  if (rb) rb.onclick = startGame;
}
function showTitle() {
  showOverlay(
    '<h1>坦克大战</h1>' +
    '<p class="sub">BATTLE CITY</p>' +
    '<div class="rules">' +
    '<p>守护基地,消灭每关 20 辆敌军坦克</p>' +
    '<p>↑↓←→ / WASD 移动 · 空格 射击</p>' +
    '<p>P 暂停 · 道具:★火力 💣清屏 ➕加命 🛡护盾 ⏱冻结</p>' +
    '</div>' +
    '<button id="startBtn" class="btn">开始游戏</button>' +
    '<p class="blink">按 Enter 开始</p>'
  );
  const sb = document.getElementById('startBtn');
  if (sb) sb.onclick = startGame;
}
function togglePause() {
  if (state !== 'play') return;
  paused = !paused;
  if (paused) {
    showOverlay('<h1>已暂停</h1><button id="resumeBtn" class="btn">继续 (P)</button>');
    const rb = document.getElementById('resumeBtn');
    if (rb) rb.onclick = togglePause;
  } else hideOverlay();
}

// ---------- 主循环 ----------
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;
  if (state !== 'title' && !paused) update(dt);
  render();
}
function update(dt) {
  animTime += dt;
  if (shieldT > 0) shieldT -= dt;
  if (freezeT > 0) freezeT -= dt;
  if (state === 'play') {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (enemies.length < 4 && spawnQueue.length > 0) {
        spawnTimer = trySpawn() ? 2.0 + Math.random() * 1.2 : 0.3;
      } else spawnTimer = 0.4;
    }
    updatePlayer(dt);
    if (!player.alive) {
      respawnTimer -= dt;
      if (respawnTimer <= 0) respawnPlayer();
    }
  } else if (state === 'clear') {
    clearTimer -= dt;
    if (clearTimer <= 0) { stage++; resetLevel(); state = 'play'; hideOverlay(); }
  } else if (state === 'over') {
    overTimer -= dt;
    if (overTimer <= 0 && !gameoverReady) showGameOver();
  }
  updateEnemies(dt);
  updateBullets(dt);
  updatePowerups(dt);
  for (const e of enemies) if (e.flash > 0) e.flash -= dt;
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].t -= dt;
    if (explosions[i].t <= 0) explosions.splice(i, 1);
  }
  updateHUD();
}

// ---------- 渲染 ----------
function drawBrick(tx, ty) {
  const x = tx * TILE, y = ty * TILE, hp = brickHp[ty][tx];
  ctx.fillStyle = '#5c2417';
  ctx.fillRect(x, y, 16, 16);
  ctx.fillStyle = '#c8502f';
  ctx.fillRect(x, y, 16, 7);
  if (hp > 1) {
    ctx.fillRect(x, y + 9, 16, 6);
    ctx.fillStyle = '#5c2417';
    ctx.fillRect(x + 3, y + 9, 1, 6);
    ctx.fillRect(x + 11, y + 9, 1, 6);
  } else {
    ctx.fillStyle = '#7a3a20';
    ctx.fillRect(x + 2, y + 10, 3, 3);
    ctx.fillRect(x + 10, y + 11, 4, 3);
  }
  ctx.fillStyle = '#5c2417';
  ctx.fillRect(x, y + 7, 16, 1);
  ctx.fillRect(x + 7, y, 1, 7);
}
function drawSteel(tx, ty) {
  const x = tx * TILE, y = ty * TILE;
  ctx.fillStyle = '#9aa0a8'; ctx.fillRect(x, y, 16, 16);
  ctx.fillStyle = '#e8ecf0'; ctx.fillRect(x, y, 16, 2); ctx.fillRect(x, y, 2, 16);
  ctx.fillStyle = '#4e545c'; ctx.fillRect(x, y + 14, 16, 2); ctx.fillRect(x + 14, y, 2, 16);
  ctx.fillStyle = '#b8bec6'; ctx.fillRect(x + 4, y + 4, 8, 8);
  ctx.fillStyle = '#6e747c'; ctx.fillRect(x + 6, y + 6, 4, 4);
}
function drawWater(tx, ty) {
  const x = tx * TILE, y = ty * TILE, f = Math.floor(animTime * 2) % 2;
  ctx.fillStyle = '#1c2f6e'; ctx.fillRect(x, y, 16, 16);
  ctx.fillStyle = '#6ea8d8';
  if (f === 0) {
    ctx.fillRect(x + 1, y + 3, 5, 1); ctx.fillRect(x + 10, y + 3, 5, 1);
    ctx.fillRect(x + 3, y + 11, 5, 1); ctx.fillRect(x + 8, y + 11, 5, 1);
  } else {
    ctx.fillRect(x + 3, y + 3, 5, 1); ctx.fillRect(x + 8, y + 3, 5, 1);
    ctx.fillRect(x + 1, y + 11, 5, 1); ctx.fillRect(x + 10, y + 11, 5, 1);
  }
}
function drawTree(tx, ty) {
  const x = tx * TILE, y = ty * TILE;
  ctx.fillStyle = '#1f5c16'; ctx.fillRect(x, y, 16, 16);
  ctx.fillStyle = '#3f9a2c';
  ctx.fillRect(x + 1, y + 1, 3, 3); ctx.fillRect(x + 6, y, 4, 3); ctx.fillRect(x + 12, y + 1, 3, 3);
  ctx.fillRect(x, y + 6, 3, 3); ctx.fillRect(x + 7, y + 6, 3, 3); ctx.fillRect(x + 13, y + 6, 3, 3);
  ctx.fillRect(x + 2, y + 12, 3, 3); ctx.fillRect(x + 8, y + 11, 3, 3); ctx.fillRect(x + 13, y + 12, 3, 3);
  ctx.fillStyle = '#1f5c16';
  ctx.fillRect(x + 4, y + 4, 4, 3); ctx.fillRect(x + 10, y + 4, 4, 3);
  ctx.fillRect(x + 4, y + 10, 4, 3); ctx.fillRect(x + 11, y + 9, 4, 3);
}
const EAGLE = [
  "....WWWWWW......",
  "...WWWWWWWW.....",
  "..WWWWWWWWWW....",
  ".WW..WWWW..WW...",
  "WW..WWWWWW..WW..",
  ".WWWWWWWWWWWW...",
  "..WWWWWWWWWW....",
  "...WW....WW.....",
  "..WWW.WW.WWW....",
  "..WW..WW..WW....",
  ".WW..WWWW..WW...",
  "WW....WW....WW..",
];
function drawBase() {
  const x = 6 * TILE, y = 12 * TILE;
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(x, y, 16, 16);
  ctx.fillStyle = baseAlive ? '#f0f0f0' : '#6a6a6a';
  for (let r = 0; r < EAGLE.length; r++)
    for (let c = 0; c < 16; c++)
      if (EAGLE[r][c] === 'W') ctx.fillRect(x + c, y + 2 + r, 1, 1);
}
function drawTankSprite(x, y, dir, c, armor) {
  ctx.save();
  ctx.translate(x + 8, y + 8);
  ctx.rotate(dir * Math.PI / 2);
  ctx.translate(-8, -8);
  ctx.fillStyle = c.dark; ctx.fillRect(0, 0, 4, 16); ctx.fillRect(12, 0, 4, 16);
  ctx.fillStyle = c.light;
  for (let i = 0; i < 4; i++) { ctx.fillRect(0, 1 + i * 4, 4, 2); ctx.fillRect(12, 1 + i * 4, 4, 2); }
  if (armor) { ctx.fillStyle = '#262626'; ctx.fillRect(3, 3, 11, 11); }
  ctx.fillStyle = c.body; ctx.fillRect(4, 4, 9, 9);
  ctx.fillStyle = c.light; ctx.fillRect(5, 5, 7, 7);
  ctx.fillStyle = c.body; ctx.fillRect(6, 6, 4, 4);
  ctx.fillStyle = c.body; ctx.fillRect(6, -4, 4, 10); // 炮管
  ctx.restore();
}
const PLAYER_C = { body:'#e8c33c', light:'#f8ec9a', dark:'#8a6d1f' };
function enemyPal(e) {
  switch (e.type) {
    case 'fast':  return { body:'#7fd0e0', light:'#c8f0f8', dark:'#3a7a88' };
    case 'power':
      return Math.floor(animTime * 5) % 2 === 0
        ? { body:'#7ad67a', light:'#d8f8d8', dark:'#3a6a3a' }
        : { body:'#e06a6a', light:'#f8d8d8', dark:'#6a3a3a' };
    case 'heavy':
      return e.hp >= 3 ? { body:'#c8ccd0', light:'#f0f4f8', dark:'#40444a' }
        : e.hp === 2 ? { body:'#e0c860', light:'#f8ecb0', dark:'#6a5a20' }
        : { body:'#e08858', light:'#f8c8a0', dark:'#6a3a20' };
    default:     return { body:'#a8b0b8', light:'#d8dce0', dark:'#5c646c' };
  }
}
function drawSpawnStar(x, y, t) {
  const p = 1 - t / 0.8, cx = x + 8, cy = y + 8, r = 4 + 8 * p;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(t * 8);
  ctx.fillStyle = '#fff';
  ctx.fillRect(-r, -1, r * 2, 2); ctx.fillRect(-1, -r, 2, r * 2);
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(-r * 0.7, -r * 0.7, r * 1.4, r * 1.4);
  ctx.restore();
}
function drawExplosion(e) {
  const p = 1 - e.t / e.dur, cx = e.x + 8, cy = e.y + 8;
  const r = (e.big ? 16 : 8) * (0.4 + 0.6 * p);
  ctx.fillStyle = p < 0.5 ? '#ff9d2e' : '#ffd23f';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.fillStyle = p < 0.5 ? '#ffd23f' : '#fff';
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8482f';
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * 6.28 + e.seed, d = (0.3 + p * 0.7) * (e.big ? 14 : 8);
    ctx.fillRect(cx + Math.cos(a) * d - 1, cy + Math.sin(a) * d - 1, 3, 3);
  }
}
function drawPowerup(p) {
  if (Math.floor(animTime * 6) % 2 === 0) return;
  const x = p.x, y = p.y;
  ctx.fillStyle = '#000'; ctx.fillRect(x, y, 16, 16);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, 15, 15);
  switch (p.type) {
    case 'star': {
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(x + 4, y + 2, 8, 12); ctx.fillRect(x + 2, y + 4, 12, 8);
      ctx.fillStyle = '#fff'; ctx.fillRect(x + 6, y + 6, 4, 4);
      break;
    }
    case 'grenade': {
      ctx.fillStyle = '#3fae49';
      ctx.beginPath(); ctx.arc(x + 8, y + 9, 6, 0, 7); ctx.fill();
      ctx.fillRect(x + 8, y + 1, 3, 3);
      ctx.fillStyle = '#ff9d2e'; ctx.fillRect(x + 9, y + 2, 1, 2);
      break;
    }
    case 'life':
      drawTankSprite(x, y, UP, { body:'#ffd23f', light:'#fff2b0', dark:'#8a6d1f' }, false);
      break;
    case 'shield': {
      ctx.fillStyle = '#f0f4f8';
      ctx.fillRect(x + 5, y + 3, 6, 9); ctx.fillRect(x + 3, y + 5, 10, 5);
      ctx.fillStyle = '#b8c0c8'; ctx.fillRect(x + 6, y + 5, 4, 5);
      break;
    }
    case 'freeze': {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x + 8, y + 8, 6, 0, 7); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 7, y + 4, 2, 5); ctx.fillRect(x + 8, y + 7, 4, 2);
      break;
    }
  }
}
function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let ty = 0; ty < ROWS; ty++)
    for (let tx = 0; tx < COLS; tx++) {
      const t = map[ty][tx];
      if (t === T.BRICK) drawBrick(tx, ty);
      else if (t === T.STEEL) drawSteel(tx, ty);
      else if (t === T.WATER) drawWater(tx, ty);
    }
  drawBase();
  for (const p of powerups) drawPowerup(p);
  ctx.fillStyle = '#fff';
  for (const b of bullets) ctx.fillRect(b.x, b.y, 4, 4);
  if (player.alive) {
    if (player.spawnT > 0) drawSpawnStar(player.x, player.y, player.spawnT);
    else {
      drawTankSprite(player.x, player.y, player.dir, PLAYER_C, false);
      if (player.shieldT > 0 && Math.floor(animTime * 8) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,240,160,0.5)';
        ctx.fillRect(player.x, player.y, 16, 16);
      }
    }
  }
  for (const e of enemies) {
    if (e.spawnT > 0) { drawSpawnStar(e.x, e.y, e.spawnT); continue; }
    drawTankSprite(e.x, e.y, e.dir, enemyPal(e), e.type === 'heavy');
    if (freezeT > 0) {
      ctx.fillStyle = 'rgba(80,160,255,0.45)';
      ctx.fillRect(e.x, e.y, 16, 16);
    } else if (e.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(e.x, e.y, 16, 16);
    }
  }
  for (let ty = 0; ty < ROWS; ty++)
    for (let tx = 0; tx < COLS; tx++)
      if (map[ty][tx] === T.TREE) drawTree(tx, ty);
  for (const e of explosions) drawExplosion(e);
}

// ---------- HUD 与覆盖层 ----------
const scoreEl = document.getElementById('score'),
      stageEl = document.getElementById('stage'),
      enemiesEl = document.getElementById('enemies'),
      livesEl = document.getElementById('lives'),
      buffsEl = document.getElementById('buffs'),
      overlayEl = document.getElementById('overlay'),
      muteBtn = document.getElementById('muteBtn');
let lastHUD = '';
function updateHUD() {
  scoreEl.textContent = String(score).padStart(6, '0');
  stageEl.textContent = String(stage).padStart(2, '0');
  enemiesEl.textContent = '×' + (spawnQueue.length + enemies.length);
  livesEl.textContent = '×' + lives;
  const parts = [];
  if (bulletLv >= 2) parts.push('火力×' + bulletLv);
  if (shieldT > 0) parts.push('护盾 ' + Math.ceil(shieldT) + 's');
  if (freezeT > 0) parts.push('冻结 ' + Math.ceil(freezeT) + 's');
  buffsEl.textContent = parts.join(' · ') || '—';
}
function showOverlay(html) {
  overlayEl.innerHTML = html;
  overlayEl.style.display = 'flex';
}
function hideOverlay() { overlayEl.style.display = 'none'; }

muteBtn.textContent = muted ? '🔇 音效关' : '🔊 音效开';
muteBtn.onclick = () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇 音效关' : '🔊 音效开';
  try { localStorage.setItem('tank-muted', muted ? '1' : '0'); } catch (e) {}
};

// ---------- 输入 ----------
const KEYMAP = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  Space:'fire', KeyJ:'fire',
};
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter') {
    if (state === 'title' || (state === 'over' && gameoverReady)) startGame();
    return;
  }
  if (e.code === 'KeyP') { togglePause(); return; }
  const k = KEYMAP[e.code];
  if (k) keys[k] = true;
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) keys[k] = false;
});
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (state === 'play' && !paused) togglePause();
});

// 触屏控制
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) {
  document.body.classList.add('touch');
  const bind = (el, k) => {
    const on = e => { e.preventDefault(); keys[k] = true; };
    const off = e => { e.preventDefault(); keys[k] = false; };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  };
  document.querySelectorAll('#dpad button').forEach(b => bind(b, b.dataset.k));
  bind(document.getElementById('fireBtn'), 'fire');
}

// ---------- 启动 ----------
resetLevel();
updateHUD();
showTitle();
requestAnimationFrame(ts => { last = ts; requestAnimationFrame(frame); });
})();
</script>
